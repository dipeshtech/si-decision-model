[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-classifier-research"
version = "0.1.0"
description = "Research-only, flags-only configurable risk classification workflow"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
risk-classifier = "risk_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
baseline = ["scikit-learn>=1.3,<2"]

[tool.setuptools.package-data]
risk_classifier = ["synthetic_patterns.json"]
